<div class="space-y-6">
  <h2 class="text-2xl font-bold text-slate-800 border-b pb-2">3. Endpoints y Operaciones de la API REST</h2>

  <div class="bg-amber-50 border-l-4 border-amber-500 p-4 mb-6">
    <h4 class="font-bold text-amber-800 mb-2">Cabeceras Obligatorias (Headers)</h4>
    @for (header of headers; track header) {
      <code class="block text-sm bg-white p-2 rounded mb-1 text-slate-700">{{ header }}</code>
    }
  </div>

  @for (group of groups; track group.title) {
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden mt-6">
      <div class="bg-slate-50 px-4 py-3 border-b border-slate-200">
        <h3 class="font-bold text-slate-800">{{ group.title }}</h3>
      </div>
      @for (ep of group.endpoints; track ep.path) {
        <app-endpoint-row [method]="ep.method" [path]="ep.path" [description]="ep.description" />
      }
    </div>
  }
</div>
