<div class="my-4 rounded-lg overflow-hidden border border-slate-700 bg-slate-900">
  <div class="flex justify-between items-center px-4 py-2 bg-slate-800 border-b border-slate-700">
    <span class="text-xs font-mono text-slate-300">{{ title() }}</span>
    <button
      (click)="copyToClipboard()"
      class="text-slate-400 hover:text-white transition-colors"
      title="Copiar al portapapeles"
      type="button"
      [attr.aria-label]="copied() ? 'Copiado' : 'Copiar al portapapeles'"
    >
      @if (copied()) {
        <lucide-icon [img]="CheckCircle2" [size]="16" class="text-emerald-400" />
      } @else {
        <lucide-icon [img]="Copy" [size]="16" />
      }
    </button>
  </div>
  <pre class="p-4 text-sm font-mono text-slate-200 overflow-x-auto"><code>{{ code() }}</code></pre>
</div>
