<div class="flex flex-col md:flex-row md:items-center gap-4 p-4 border-b border-slate-100 hover:bg-slate-50 transition-colors">
  <div class="shrink-0 w-20">
    <span class="px-2 py-1 rounded text-xs font-bold border" [class]="methodClass()">
      {{ method() }}
    </span>
  </div>
  <div class="flex-1">
    <code class="text-sm font-mono text-slate-800 bg-slate-100 px-2 py-1 rounded">{{ path() }}</code>
    <p class="text-sm text-slate-600 mt-1">{{ description() }}</p>
  </div>
</div>
